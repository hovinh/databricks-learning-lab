<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="300" fill="#ffffff"/>

  <!-- Column headers -->
  <rect x="160" y="20" width="190" height="52" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="255" y="42" text-anchor="middle" font-weight="bold" fill="#14532d">Stage 0</text>
  <text x="255" y="61" text-anchor="middle" fill="#14532d" font-size="12">fully local</text>

  <rect x="365" y="20" width="190" height="52" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="460" y="42" text-anchor="middle" font-weight="bold" fill="#78350f">Stage 1</text>
  <text x="460" y="61" text-anchor="middle" fill="#78350f" font-size="12">hybrid</text>

  <rect x="570" y="20" width="170" height="52" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="655" y="42" text-anchor="middle" font-weight="bold" fill="#1e3a8a">Stage 2</text>
  <text x="655" y="61" text-anchor="middle" fill="#1e3a8a" font-size="12">remote</text>

  <!-- Row labels -->
  <g fill="#0f172a" font-weight="bold">
    <text x="20" y="108">Code runs on</text>
    <text x="20" y="158">Data</text>
    <text x="20" y="208">Model</text>
    <text x="20" y="258">Selected by</text>
  </g>
  <g stroke="#e2e8f0">
    <line x1="20" y1="128" x2="740" y2="128"/>
    <line x1="20" y1="178" x2="740" y2="178"/>
    <line x1="20" y1="228" x2="740" y2="228"/>
  </g>

  <!-- Stage 0 -->
  <g text-anchor="middle" fill="#334155">
    <text x="255" y="108">laptop</text>
    <text x="255" y="158">parquet files under ml/data/</text>
    <text x="255" y="208">local model file</text>
    <text x="255" y="252" font-family="Consolas, monospace" font-size="12">--data-source local</text>
    <text x="255" y="270" font-size="12">no Databricks calls at all</text>
  </g>

  <!-- Stage 1 -->
  <g text-anchor="middle" fill="#334155">
    <text x="460" y="108">laptop</text>
    <text x="460" y="158">UC tables, via Connect</text>
    <text x="460" y="208">UC model registry</text>
    <text x="460" y="252" font-family="Consolas, monospace" font-size="12">--data-source uc</text>
    <text x="460" y="270" font-size="12">(the default)</text>
  </g>

  <!-- Stage 2 -->
  <g text-anchor="middle" fill="#334155">
    <text x="655" y="108" font-weight="bold" fill="#1e3a8a">serverless job</text>
    <text x="655" y="158">UC tables</text>
    <text x="655" y="208">UC model registry</text>
    <text x="655" y="252" font-family="Consolas, monospace" font-size="12">bundle run</text>
    <text x="655" y="270" font-size="12">is_databricks() is True</text>
  </g>
</svg>
