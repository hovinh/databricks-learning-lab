<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#ffffff"/>

  <!-- Entry points -->
  <rect x="150" y="20" width="400" height="66" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="350" y="44" text-anchor="middle" font-weight="bold" fill="#78350f">Entry points: pipelines/*.py</text>
  <text x="350" y="64" text-anchor="middle" fill="#78350f" font-size="12">feature_engineering · train · predict</text>
  <text x="350" y="79" text-anchor="middle" fill="#92400e" font-size="11">wire logic to boundaries; setup_logger() only under __main__</text>

  <!-- Pure logic -->
  <rect x="40" y="150" width="270" height="80" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="175" y="176" text-anchor="middle" font-weight="bold" fill="#14532d">Pure logic: features/, model/</text>
  <text x="175" y="197" text-anchor="middle" fill="#14532d" font-size="12">pandas in, pandas out</text>
  <text x="175" y="215" text-anchor="middle" fill="#14532d" font-size="12">no I/O, no logging setup</text>

  <!-- Boundaries -->
  <rect x="390" y="150" width="330" height="80" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="555" y="176" text-anchor="middle" font-weight="bold" fill="#1e3a8a">Boundaries</text>
  <text x="555" y="197" text-anchor="middle" fill="#1e3a8a" font-size="12">connect.py: the only Spark / UC caller</text>
  <text x="555" y="215" text-anchor="middle" fill="#1e3a8a" font-size="12">mlflow_utils.py: the only mlflow.* caller</text>

  <!-- Databricks -->
  <rect x="390" y="310" width="330" height="56" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="555" y="334" text-anchor="middle" font-weight="bold" fill="#0f172a">Databricks</text>
  <text x="555" y="353" text-anchor="middle" fill="#334155" font-size="12">Spark · Unity Catalog · MLflow</text>

  <!-- Calls -->
  <line x1="290" y1="86" x2="200" y2="147" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="116" text-anchor="middle" fill="#475569" font-size="12">calls</text>
  <line x1="410" y1="86" x2="510" y2="147" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="508" y="116" text-anchor="middle" fill="#475569" font-size="12">calls</text>
  <line x1="555" y1="230" x2="555" y2="307" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Test seam -->
  <line x1="370" y1="268" x2="740" y2="268" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="380" y="261" fill="#dc2626" font-size="12">tests mock here: everything above runs offline</text>

  <!-- Env -->
  <rect x="40" y="290" width="270" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-dasharray="4 3"/>
  <text x="175" y="315" text-anchor="middle" font-weight="bold" fill="#0f172a">settings.Env</text>
  <text x="175" y="335" text-anchor="middle" fill="#334155" font-size="12">catalog, schema, data_source</text>
  <text x="175" y="353" text-anchor="middle" fill="#334155" font-size="12">passed into every boundary call</text>
</svg>
