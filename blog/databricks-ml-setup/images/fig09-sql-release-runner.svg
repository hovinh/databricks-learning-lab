<svg xmlns="http://www.w3.org/2000/svg" width="700" height="650" viewBox="0 0 700 650" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="700" height="650" fill="#ffffff"/>

  <!-- 1. Read -->
  <rect x="60" y="20" width="320" height="50" rx="8" fill="#ffffff" stroke="#334155"/>
  <text x="220" y="41" text-anchor="middle" fill="#0f172a">Read manifest + audit history</text>
  <text x="220" y="59" text-anchor="middle" fill="#475569" font-size="12">for this release name, catalog and schema</text>
  <line x1="220" y1="70" x2="220" y2="92" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. Parse -->
  <rect x="60" y="95" width="320" height="56" rx="8" fill="#ffffff" stroke="#334155"/>
  <text x="220" y="118" text-anchor="middle" fill="#0f172a">Parse each script: fill {catalog} {schema},</text>
  <text x="220" y="137" text-anchor="middle" fill="#0f172a">split on lines ending in ;</text>
  <line x1="220" y1="151" x2="220" y2="168" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. Classify -->
  <polygon points="220,171 340,215 220,259 100,215" fill="#f8fafc" stroke="#334155"/>
  <text x="220" y="210" text-anchor="middle" fill="#0f172a" font-size="12">(script, no, hash)</text>
  <text x="220" y="227" text-anchor="middle" fill="#0f172a" font-size="12">seen before?</text>

  <line x1="340" y1="215" x2="437" y2="177" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="215" x2="437" y2="215" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="215" x2="437" y2="253" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="440" y="160" width="230" height="34" rx="17" fill="#f1f5f9" stroke="#64748b"/>
  <text x="555" y="182" text-anchor="middle" fill="#0f172a"><tspan font-weight="bold">SKIP</tspan> · already SUCCESS</text>
  <rect x="440" y="198" width="230" height="34" rx="17" fill="#fef3c7" stroke="#d97706"/>
  <text x="555" y="220" text-anchor="middle" fill="#78350f"><tspan font-weight="bold">RETRY</tspan> · seen, not SUCCESS</text>
  <rect x="440" y="236" width="230" height="34" rx="17" fill="#dbeafe" stroke="#2563eb"/>
  <text x="555" y="258" text-anchor="middle" fill="#1e3a8a"><tspan font-weight="bold">NEW</tspan> · never seen</text>

  <polyline points="555,270 555,310 383,310" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. Plan -->
  <rect x="60" y="290" width="320" height="40" rx="8" fill="#ffffff" stroke="#334155"/>
  <text x="220" y="315" text-anchor="middle" fill="#0f172a">Print the plan</text>
  <line x1="220" y1="330" x2="220" y2="337" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Dry run -->
  <polygon points="220,340 300,375 220,410 140,375" fill="#f8fafc" stroke="#334155"/>
  <text x="220" y="380" text-anchor="middle" fill="#0f172a" font-size="12">--dry-run?</text>
  <line x1="300" y1="375" x2="417" y2="375" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="358" y="368" text-anchor="middle" fill="#475569" font-size="12">yes</text>
  <rect x="420" y="355" width="250" height="40" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="545" y="380" text-anchor="middle" fill="#0f172a">Stop: nothing executed or logged</text>
  <line x1="220" y1="410" x2="220" y2="437" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="428" fill="#475569" font-size="12">no</text>

  <!-- 5. Pre-log -->
  <rect x="60" y="440" width="320" height="40" rx="8" fill="#ffffff" stroke="#334155"/>
  <text x="220" y="465" text-anchor="middle" fill="#0f172a">Pre-log NEW rows in the audit table</text>
  <line x1="220" y1="480" x2="220" y2="502" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 6. Execute -->
  <rect x="60" y="505" width="320" height="40" rx="8" fill="#ffffff" stroke="#334155"/>
  <text x="220" y="530" text-anchor="middle" fill="#0f172a">Execute in order, stop at the first failure</text>
  <line x1="220" y1="545" x2="220" y2="567" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 7. Write back -->
  <rect x="60" y="570" width="320" height="56" rx="8" fill="#ffffff" stroke="#334155"/>
  <text x="220" y="593" text-anchor="middle" fill="#0f172a">MERGE final statuses into the audit table</text>
  <text x="220" y="612" text-anchor="middle" fill="#dc2626" font-size="12">any failure: raise, rerun resumes from it</text>
</svg>
